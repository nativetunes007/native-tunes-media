name: fetch
on:
  push:
    paths: ['fetch/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched
          while read -r name url; do [ -n "$name" ] && curl -sSL -A "Mozilla/5.0" -o "fetched/$name" "$url"; done < fetch/urls.txt
          ls -la fetched
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetched && git commit -m "fetched files" && git push || true
